# Automatically build the project and run any configured tests for every push
# and submitted pull request.

name: build

on: [pull_request, push]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]

    runs-on: ${{ matrix.os }}

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      # Java 21 is used to run Gradle/Stonecutter.
      - name: setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Java 25 is required by Minecraft 26.1.2.
      # This is installed alongside JDK 21 so Gradle can find it
      # as a Java toolchain.
      - name: setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # Restore Java 21 as the JVM used to launch Gradle.
      - name: set Java 21 as Gradle JVM
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "JAVA_HOME_21_X64=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
            echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          else
            echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          fi

      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: show Java versions
        run: |
          java -version
          ./gradlew --version

      - name: build
        run: ./gradlew build

      - name: capture build artifacts
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v5
        with:
          name: Artifacts
          path: build/libs/

