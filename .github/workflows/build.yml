name: build

on: [pull_request, push]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]

    runs-on: ${{ matrix.os }}

    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Gradle / Stonecutter runs on Java 21
      - name: setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Minecraft 26.1.2 requires Java 25
      - name: setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      # Tell Gradle where BOTH JDKs are installed.
      - name: configure Java toolchains
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "GRADLE_JAVA_INSTALLATIONS_PATHS=$JAVA_HOME_21_X64,$JAVA_HOME_25_X64" >> "$GITHUB_ENV"

      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: show Java installations
        shell: bash
        run: |
          echo "Java 21: $JAVA_HOME_21_X64"
          echo "Java 25: $JAVA_HOME_25_X64"
          echo "Gradle paths: $GRADLE_JAVA_INSTALLATIONS_PATHS"

          "$JAVA_HOME_21_X64/bin/java" -version || true
          "$JAVA_HOME_25_X64/bin/java" -version || true

      - name: build
        run: ./gradlew build

      - name: capture build artifacts
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v5
        with:
          name: Artifacts
          path: build/libs/
