# Automatically build the project and run any configured tests for every push
# and submitted pull request.

name: build

on: [pull_request, push]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]

    runs-on: ${{ matrix.os }}

    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      # Validate the Gradle wrapper without the deprecated wrapper-validation-action.
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Java 21 is used to run Gradle and Stonecutter.
      - name: setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Minecraft 26.1.2 requires Java 25.
      - name: setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      # Make Java 21 the JVM used to launch Gradle.
      - name: set Java 21 as Gradle JVM
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: show Java versions
        run: |
          java -version
          ./gradlew --version

      - name: build
        run: ./gradlew build

      - name: capture build artifacts
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v5
        with:
          name: Artifacts
          path: build/libs/
